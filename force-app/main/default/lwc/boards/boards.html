<template>
    <lightning-card title="Boards">
        <lightning-button-icon 
            icon-name="utility:add" 
            alternative-text="Add Board"
            onclick={handleAddBoard}
            slot="actions"
        ></lightning-button-icon>
    </lightning-card>
    <template if:true={showModalPopup}>
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">

        <div class="slds-modal__container">
            <!-- modal header start -->
            <header class="slds-modal__header">
                <button onclick = {closePopupHandler} class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close">
                    <lightning-icon icon-name="utility:close"
                    alternative-text="close"
                    variant="inverse"
                    size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Create Board</h2>
            </header>
        
            <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <lightning-record-edit-form
                        object-api-name={boardObjectApiName}
                        record-id={recordId}
                    >
                        <lightning-input-field field-name={boardDescriptionField}> </lightning-input-field>
                        <lightning-input-field field-name={boardNoOfSectionsField} onchange={handleSectionChange}> </lightning-input-field>
                        <lightning-input-field field-name={boardNameField}> </lightning-input-field>
                        <template for:each={sections} for:item="section">
                            <lightning-input-field key={section.Id} field-name={section.Name}> </lightning-input-field>
                        </template>
                        <div class="slds-var-m-top_medium">
                            <lightning-button variant="brand" type="submit" label="Save">
                            </lightning-button>
                            <lightning-button variant="brand" type="submit" label="close" onclick={closePopupHandler}>
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
            </div>
        
        </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    
    <lightning-datatable
      key-field="id"
      data={boards}
      columns={columns}
    ></lightning-datatable>
    
</template>
